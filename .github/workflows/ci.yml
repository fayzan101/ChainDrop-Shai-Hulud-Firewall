name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Node fixture, interceptor, feature, and sandbox tests
        run: |
          npm ci
          npm test
        env:
          SENTRYHULUD_DOCKER_INTEGRATION: "1"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Classifier and eval tests
        run: |
          python -m pip install pytest numpy scikit-learn joblib
          PYTHONPATH=. python -m pytest classifier/tests rag/tests reasoner/tests eval/tests -q
          PYTHONPATH=. python -m classifier.train
          PYTHONPATH=. python -m eval.run_heldout --output-dir eval/results

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: API tests
        run: |
          cd api
          npm ci
          npm test

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dashboard build
        run: |
          cd dashboard
          npm ci
          npm run build
